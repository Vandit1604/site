    <button type="button" class="theme-toggle page-tool" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="page-tool-sun" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" /></svg>

<script>
  // Mark the current page tab as active (aria-current drives the raised style).
  // The home page is the hub, so it has no "back home" link.
  if ((location.pathname.replace(/\/$/, "") || "/") === "/") {
    document.querySelector("[data-page-home]").hidden = true;
  }

  // Dark-mode toggle: flip the `dark` class on <html> via a View Transition
  // (45° slash wipe in motion.css); instant swap where unsupported / reduced.
  function setTheme() {
    var root = document.documentElement;
    root.classList.add("no-transitions", "theme-touched");
    var isDark = root.classList.toggle("dark");
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { root.classList.remove("no-transitions"); });
    });
    try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (e) {}
  }
  document.querySelectorAll(".theme-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || !document.startViewTransition) { setTheme(); return; }
      var root = document.documentElement;
      root.classList.add("vt-theme");
      var vt = document.startViewTransition(setTheme);
      vt.finished.finally(function () { root.classList.remove("vt-theme"); });
    });
  });

  // Page-slide for browsers WITHOUT cross-document view transitions (Firefox,
  // older Safari). Chromium ships them, so the CSS @view-transition handles it
  // there; `CSSViewTransitionRule` is the feature flag. Slide the incoming page
  // in at full brightness (transform only, no fade) so the screen never dims.
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if ("CSSViewTransitionRule" in window) return;
    var scroll = document.querySelector(".app-scroll");
    if (!scroll || !scroll.animate) return;
    scroll.animate(
      [{ transform: "translateX(8%)" }, { transform: "none" }],
      { duration: 340, easing: "cubic-bezier(0.25,1,0.5,1)" }
    );
  })();
</script>
