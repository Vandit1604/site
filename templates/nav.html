<script>
  // Mark the current page tab as active (aria-current drives the raised style).
  (function () {
    var here = location.pathname.replace(/\/$/, "") || "/";
    document.querySelectorAll('.nav-inner a[href^="/"]').forEach(function (a) {
      var path = a.getAttribute("href").replace(/\/$/, "") || "/";
      if (path === here) a.setAttribute("aria-current", "page");
    });

    // On mobile the tab strip scrolls. Keep the current page's tab visible, and
    // show a right-edge fade only while more tabs sit off-screen to the right.
    var tabs = document.querySelector(".nav-tabs");
    if (!tabs) return;
    var active = tabs.querySelector('.nav-tab[aria-current="page"]');
    if (active) {
      var tr = tabs.getBoundingClientRect(), ar = active.getBoundingClientRect();
      if (ar.left < tr.left || ar.right > tr.right) {
        active.scrollIntoView({ inline: "center", block: "nearest" });
      }
    }
    var updateFade = function () {
      var more = tabs.scrollLeft + tabs.clientWidth < tabs.scrollWidth - 2;
      tabs.classList.toggle("nav-tabs--more", more);
    };
    updateFade();
    tabs.addEventListener("scroll", updateFade, { passive: true });
    window.addEventListener("resize", updateFade);
  })();

  // Dark-mode toggle: flip the `dark` class on <html> via a View Transition
  // (45° slash wipe in motion.css); instant swap where unsupported / reduced.
  function setTheme() {
    var isDark = document.documentElement.classList.toggle("dark");
    try { localStorage.setItem("theme", isDark ? "dark" : "light"); } catch (e) {}
  }
  document.querySelectorAll(".theme-toggle").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (reduce || !document.startViewTransition) { setTheme(); return; }
      var root = document.documentElement;
      root.classList.add("vt-theme");
      var vt = document.startViewTransition(setTheme);
      vt.finished.finally(function () { root.classList.remove("vt-theme"); });
    });
  });

  // Page-slide for browsers WITHOUT cross-document view transitions (Firefox,
  // older Safari). Chromium ships them, so the CSS @view-transition handles it
  // there; `CSSViewTransitionRule` is the feature flag. Slide the incoming page
  // in at full brightness (transform only, no fade) so the screen never dims.
  (function () {
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    if ("CSSViewTransitionRule" in window) return;
    var scroll = document.querySelector(".app-scroll");
    if (!scroll || !scroll.animate) return;
    scroll.animate(
      [{ transform: "translateX(8%)" }, { transform: "none" }],
      { duration: 340, easing: "cubic-bezier(0.25,1,0.5,1)" }
    );
  })();
</script>
