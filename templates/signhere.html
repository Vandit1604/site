<!-- "Sign here" closing card: a soft raised panel echoing the tactile reference,
     with the signature and the two conversion pills. -->
<section data-reveal class="box">
  <div class="signcard">
    <div class="signcard__top">
      <span class="signcard__label">Sign here:</span>
      <div class="signpad" data-signpad>
        <canvas class="signpad__canvas" data-signpad-canvas aria-label="Signature pad. Draw your signature with your pointer or finger."></canvas>
        <span class="signpad__hint" data-signpad-hint aria-hidden="true">leave your mark</span>
        <button type="button" class="signpad__clear" data-signpad-clear>clear</button>
      </div>
    </div>

    <div class="signcard__rule"></div>

    <div class="signcard__foot">
      <div class="signcard__meta">
        <span class="signcard__glyph" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><path d="M2 2l7.586 7.586"/><circle cx="11" cy="11" r="2"/></svg>
        </span>
        <span>Thanks for scrolling this far. Let&rsquo;s build something.</span>
      </div>

      <div class="signcard__actions">
        <a href="https://cal.com/v4nd1t/30min" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
          Book a call <span aria-hidden="true">&rarr;</span>
        </a>
        <a href="mailto:vanditsinghkv@gmail.com" class="btn btn-secondary">Email</a>
      </div>
    </div>
  </div>
</section>
