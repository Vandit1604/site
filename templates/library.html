{{ template "header.html" .}}

<div class="home">

  <header class="home-hero">
    <h1 class="home-name">Library</h1>
    <p class="home-p">
      Books, guides and tools I keep coming back to.
    </p>
  </header>

  {{ range .Categories }}
  <section class="home-sec" aria-labelledby="h-cat-{{ .Name }}">
    <h2 id="h-cat-{{ .Name }}" class="home-h"><span>~/</span>{{ .Name }}</h2>
    <ol class="home-rows">
      {{ range .Links }}
      <li class="home-li">
        <div class="home-row home-row--flush">
          <p class="home-what"><a class="home-title" href="{{ .URL }}" target="_blank" rel="noopener noreferrer" data-tip="Opens in a new tab">{{ .Title }}</a><button type="button" class="home-xbtn" aria-expanded="false" aria-label="Details: {{ .Title }}">{{ template "icon:chevron-down" }}</button></p>
        </div>
        <div class="home-xdetail" inert><div class="home-xinner">
          <p class="home-note">{{ .Description }}</p>
        </div></div>
      </li>
      {{ end }}
    </ol>
  </section>
  {{ else }}
  <p class="home-note">Nothing here yet.</p>
  {{ end }}

</div>

{{ template "footer.html" .}}
