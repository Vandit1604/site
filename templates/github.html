<!-- Live GitHub contribution calendar, shown at the foot of the Open Source
     section (the receipts and the graph tell one story). Populated by micro.js
     from /api/github (cached server-side). Hidden until data loads. -->
<div class="mt-9" data-github hidden>
  <h3 class="coord uppercase tracking-wider text-gray-500 dark:text-gray-500 mb-3">Contribution activity</h3>

  <!-- Contribution calendar, unframed. -->
  <div class="gh-panel">
    <div class="gh-cal-wrap">
      <div class="gh-cal" data-gh-cal aria-hidden="true"></div>
    </div>
    <div class="gh-cal-foot">
      <span class="coord text-gray-500 dark:text-gray-500">
        <span class="font-semibold text-black dark:text-white" data-gh-total>&mdash;</span> contributions in the last year
      </span>
      <span class="gh-legend coord text-gray-500 dark:text-gray-500" aria-hidden="true">
        Less
        <i class="gh-day" data-level="0"></i>
        <i class="gh-day" data-level="1"></i>
        <i class="gh-day" data-level="2"></i>
        <i class="gh-day" data-level="3"></i>
        <i class="gh-day" data-level="4"></i>
        More
      </span>
    </div>
  </div>
</div>
