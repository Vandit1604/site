{{ template "header.html" .}}

<link rel="stylesheet" href="/static/css/gallery.css" />

<script>
  // Decide trail-vs-grid before the browser paints anything below. These are
  // the same conditions gallery-trail.js needs to run at all; answering them
  // here means the fallback grid never flashes on its way out. Runs inline and
  // ahead of the markup on purpose: a deferred script is far too late.
  (function () {
    try {
      // The trail runs on any device that allows motion. Pointer events (which
      // gallery-trail.js uses) fire for both mouse and touch, so a finger paints
      // the trail just like a cursor. Reduced-motion and no-JS keep the grid.
      var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      if (!reduced) document.documentElement.classList.add("trail-mode");
    } catch (e) {
      /* no matchMedia: fall through to the grid, which always works */
    }
  })();
</script>

<div class="home">

  <header class="home-hero" style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:0.5rem">
    <div>
      <h1 class="home-name">Gallery</h1>
      <p id="gallery-hint" class="home-p">A few moments from my camera roll.</p>
    </div>
    <!-- audio toggle (only shown when the interactive trail is active) -->
    <button
      id="audio-toggle"
      type="button"
      hidden
      aria-pressed="false"
      class="press home-chip home-chip--plain"
    >
      <span id="audio-icon">&#9834;</span>
      <span id="audio-label">Play piano</span>
    </button>
  </header>

  <section data-reveal class="home-sec" style="margin-top:1.5rem">

    {{ if .galleryPhotos }}
    <!-- Interactive cursor image-trail stage (pointer devices, motion allowed).
         Shown/hidden by gallery.css via the `trail-mode` class set above, not
         by script, see gallery.css for why. -->
    <div
      id="trail-stage"
      class="gallery-stage relative w-full h-[70vh] overflow-hidden cursor-grab select-none"
      aria-hidden="true"
    ></div>

    <!-- Fallback: browsable masonry grid (touch / reduced-motion / no-JS) -->
    <div id="photo-grid" class="gallery-grid columns-2 md:columns-3 gap-3 [column-fill:_balance]">
      {{ range .galleryPhotos }}
      <a
        href="{{ . }}"
        target="_blank"
        rel="noopener"
        class="mb-3 block overflow-hidden  break-inside-avoid group"
      >
        <img
          src="{{ . }}"
          alt="Photo by Vandit Singh"
          loading="lazy"
          class="w-full h-auto object-cover transition-transform group-hover:scale-105"
        />
      </a>
      {{ end }}
    </div>

    <script>
      window.GALLERY_PHOTOS = [
        {{- range $i, $p := .galleryPhotos }}{{ if $i }},{{ end }}"{{ $p }}"{{ end -}}
      ];
    </script>
    <!-- Tone.js is NOT loaded here. It used to be a render-blocking tag, which
         stalled the parser on a third-party CDN round trip and held up the
         deferred script below, the grid painted in that gap. The piano can't
         make a sound before a user gesture anyway, so the script fetches it on
         the first press instead. Nothing audio-related is on the load path. -->
    <script src="/static/js/gallery-trail.js" defer></script>
    {{ else }}
    <p class="home-note">No photos yet.</p>
    {{ end }}
  </section>
</div>

{{ template "footer.html" .}}
