<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect class="diagram-bg" x="0" y="0" width="680" height="300" fill="#f8f8f7"/>
  <title>Four regex matchers: four scans versus one shared scan</title>
  <desc>Before the fix, each of four matchers on the same label walks every value of that label. After, one walk tests all four matchers on each value.</desc>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="30" y="30" font-size="14" font-weight="500" fill="#1a1a18">Before: 4 matchers, 4 walks of the label values</text>
  <g font-size="12" fill="#712B13">
    <rect x="30" y="42" width="500" height="22" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="40" y="58">i !~ "1.*"   walks all N values of i</text>
    <rect x="30" y="70" width="500" height="22" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="40" y="86">i !~ "2.*"   walks all N values of i</text>
    <rect x="30" y="98" width="500" height="22" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="40" y="114">i !~ "3.*"   walks all N values of i</text>
    <rect x="30" y="126" width="500" height="22" rx="5" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/><text x="40" y="142">i !~ "4.*"   walks all N values of i</text>
  </g>
  <text x="545" y="98" font-size="13" fill="#712B13">about 4N tests</text>
  <text x="30" y="188" font-size="14" font-weight="500" fill="#1a1a18">After: one walk, every matcher tested on each value</text>
  <rect x="30" y="200" width="500" height="22" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="40" y="216" font-size="12" fill="#0C447C">for each value v of i:  not (1.* or 2.* or 3.* or 4.* matches v)</text>
  <text x="545" y="216" font-size="13" fill="#0C447C">about N tests</text>
  <text x="30" y="262" font-size="12" fill="#5f5e5a">A series has exactly one value for i, so one pass over the values can answer all four matchers at once.</text>
</svg>
