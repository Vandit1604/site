<svg width="100%" viewBox="0 0 680 330" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect class="diagram-bg" x="0" y="0" width="680" height="330" fill="#f8f8f7"/>
  <title>A B+ tree with linked leaves</title>
  <desc>A root node points to internal nodes, which point to leaf nodes. Leaves hold the keys and row pointers and are linked left to right, so a range scan walks the leaf chain.</desc>
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#73726c" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="24" text-anchor="middle" font-size="12" fill="#5f5e5a">root: only signposts, no rows</text>
  <rect x="270" y="34" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="340" y="57" text-anchor="middle" font-size="13" fill="#0C447C">m  |  t</text>
  <line x1="300" y1="70" x2="150" y2="118" stroke="#73726c" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="340" y1="70" x2="340" y2="118" stroke="#73726c" stroke-width="1.2" marker-end="url(#a1)"/>
  <line x1="380" y1="70" x2="530" y2="118" stroke="#73726c" stroke-width="1.2" marker-end="url(#a1)"/>
  <text x="196" y="88" font-size="11" fill="#5f5e5a">keys &lt; m</text>
  <text x="346" y="96" font-size="11" fill="#5f5e5a">m to t</text>
  <text x="470" y="88" font-size="11" fill="#5f5e5a">keys &gt;= t</text>
  <g font-size="13" fill="#0C447C">
    <rect x="80" y="120" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="150" y="143" text-anchor="middle">d  |  h</text>
    <rect x="270" y="120" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="340" y="143" text-anchor="middle">p  |  r</text>
    <rect x="460" y="120" width="140" height="36" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/><text x="530" y="143" text-anchor="middle">w  |  y</text>
  </g>
  <g stroke="#73726c" stroke-width="1" marker-end="url(#a1)">
    <line x1="110" y1="156" x2="64" y2="200"/><line x1="150" y1="156" x2="150" y2="200"/><line x1="190" y1="156" x2="236" y2="200"/>
    <line x1="300" y1="156" x2="290" y2="200"/><line x1="340" y1="156" x2="340" y2="200"/><line x1="380" y1="156" x2="390" y2="200"/>
    <line x1="490" y1="156" x2="480" y2="200"/><line x1="530" y1="156" x2="530" y2="200"/><line x1="570" y1="156" x2="580" y2="200"/>
  </g>
  <g font-size="12" fill="#633806">
    <rect x="20" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="65" y="221" text-anchor="middle">a b c</text><text x="65" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="105" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="150" y="221" text-anchor="middle">d e f g</text><text x="150" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="190" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="235" y="221" text-anchor="middle">h i j k l</text><text x="235" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="275" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="320" y="221" text-anchor="middle">m n o</text><text x="320" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="360" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="405" y="221" text-anchor="middle">p q</text><text x="405" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="445" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="490" y="221" text-anchor="middle">r s</text><text x="490" y="237" text-anchor="middle" font-size="10">→ rows</text>
    <rect x="530" y="202" width="90" height="44" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/><text x="575" y="221" text-anchor="middle">t u v</text><text x="575" y="237" text-anchor="middle" font-size="10">→ rows</text>
  </g>
  <g stroke="#993C1D" stroke-width="1.5" fill="none" marker-end="url(#a1)">
    <line x1="111" y1="268" x2="187" y2="268"/><line x1="196" y1="268" x2="272" y2="268"/><line x1="281" y1="268" x2="357" y2="268"/><line x1="366" y1="268" x2="442" y2="268"/>
  </g>
  <text x="20" y="262" font-size="11" fill="#5f5e5a">leaves hold the keys and row pointers, and each leaf points to the next</text>
  <text x="20" y="300" font-size="12" fill="#993C1D">BETWEEN 'h' AND 'q': walk down once to 'h', then follow the leaf chain. No second descent.</text>
</svg>
