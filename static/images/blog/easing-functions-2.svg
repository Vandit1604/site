  <rect x="60" y="50" width="300" height="200" fill="none" stroke="#b4b2a9" stroke-width="0.5"/>
  <line x1="60" y1="250" x2="96" y2="134.8" stroke="#73726c" stroke-width="1"/><circle cx="96" cy="134.8" r="4" fill="#1d4ed8"/>
  <line x1="360" y1="50" x2="135" y2="50" stroke="#73726c" stroke-width="1"/><circle cx="135" cy="50" r="4" fill="#1d4ed8"/>
