<svg width="100%" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif">
  <rect class="diagram-bg" x="0" y="0" width="680" height="300" fill="#f8f8f7"/>
  <title>An After Effects segment drawn as a cubic-bezier</title>
  <desc>A segment from 0 to 1 with an out handle of 12 percent influence at 4.8 times average speed and an in handle of 75 percent influence at zero speed. The handles are the control points of a cubic-bezier.</desc>
