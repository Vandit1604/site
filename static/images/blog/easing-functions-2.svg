  <text class="h" x="400" y="80">out handle</text><text class="c" x="400" y="100">influence 12%, speed 4.8x</text><text class="c" x="400" y="118">x1 = 0.12, y1 = 4.8 x 0.12 = 0.576</text>
  <text class="h" x="400" y="160">in handle</text><text class="c" x="400" y="180">influence 75%, speed 0x</text><text class="c" x="400" y="198">x2 = 1 - 0.75 = 0.25, y2 = 1 - 0 = 1</text>
